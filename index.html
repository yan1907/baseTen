<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Desafía tú TALENTO</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background-color: #000;
            color: #0F0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .game-container {
            background-color: #222;
            border: 3px solid #0F0;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px #0F0;
            width: 90%;
            max-width: 500px;
        }

        .screen {
            background-color: #111;
            border: 2px solid #0F0;
            padding: 10px;
            margin-bottom: 15px;
            min-height: 100px;
            word-wrap: break-word;
        }

        input, button {
            background-color: #111;
            color: #0F0;
            border: 1px solid #0F0;
            padding: 10px;
            margin: 5px;
            font-family: 'Courier New', monospace;
            width: 200px;
            text-align: center;
        }

        button {
            width: auto;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #0F0;
            color: #000;
        }

        .number-display {
            font-size: 2em;
            margin: 20px 0;
            word-break: break-all;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #111;
            border: 1px solid #0F0;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background-color: #0F0;
            width: 0%;
            transition: width 0.5s ease;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .retro-scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
        }
    </style>
</head>
<body>
    <div class="retro-scanlines"></div>
    <div class="game-container">
        <h1>🖥️ Conversión de Bases 🖥️</h1>
        
        <div class="screen" id="messageScreen">
            Bienvenido al juego de conversión de bases. ¡Convierte números a decimal!
        </div>

        <div class="number-display" id="challengeNumber">-</div>
        
        <div>
            <p>Base: <span id="challengeBase">-</span></p>
            <input type="number" id="userAnswer" placeholder="Resultado en decimal">
            <button onclick="checkAnswer()">Verificar</button>
        </div>

        <div class="screen" id="resultScreen">
            Esperando tu respuesta...
        </div>

        <div class="stats">
            <span>Nivel: <span id="currentLevel">1</span></span>
            <span>Puntos: <span id="scoreDisplay">0</span></span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <script>
        // Configuración de niveles
        const LEVELS = [
            {
                name: "Fácil",
                bases: [2, 3, 4],
                minDigits: 1,
                maxDigits: 3,
                pointsToNextLevel: 100
            },
            {
                name: "Intermedio",
                bases: [5, 6, 7],
                minDigits: 2,
                maxDigits: 4,
                pointsToNextLevel: 250
            },
            {
                name: "Avanzado",
                bases: [8, 9],
                minDigits: 3,
                maxDigits: 5,
                pointsToNextLevel: 500
            },
            {
                name: "Experto",
                bases: [10],
                minDigits: 4,
                maxDigits: 6,
                pointsToNextLevel: 1000
            }
        ];

        let gameState = {
            currentLevel: 0,
            score: 0,
            currentChallenge: null,
            consecutiveCorrect: 0
        };

        function generateRandomNumber(minDigits, maxDigits) {
            // Generar un número con dígitos aleatorios dentro del rango
            const digits = Math.floor(Math.random() * (maxDigits - minDigits + 1)) + minDigits;
            const min = Math.pow(10, digits - 1);
            const max = Math.pow(10, digits) - 1;
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateChallenge() {
            const currentLevelConfig = LEVELS[gameState.currentLevel];
            
            // Seleccionar base aleatoria para el nivel actual
            const sourceBase = currentLevelConfig.bases[
                Math.floor(Math.random() * currentLevelConfig.bases.length)
            ];

            // Generar número aleatorio
            const number = generateRandomNumber(
                currentLevelConfig.minDigits, 
                currentLevelConfig.maxDigits
            );
            const numberInBase = number.toString(sourceBase).toUpperCase();

            gameState.currentChallenge = {
                number: number,
                base: sourceBase,
                baseRepresentation: numberInBase
            };

            // Actualizar interfaz
            document.getElementById('challengeNumber').textContent = numberInBase;
            document.getElementById('challengeBase').textContent = sourceBase;
            document.getElementById('userAnswer').value = '';
            document.getElementById('resultScreen').textContent = 'Esperando tu respuesta...';
            document.getElementById('resultScreen').className = 'screen';
        }

        function checkAnswer() {
            const userAnswer = parseInt(document.getElementById('userAnswer').value);
            const resultScreen = document.getElementById('resultScreen');
            const progressFill = document.getElementById('progressFill');

            if (userAnswer === gameState.currentChallenge.number) {
                // Respuesta correcta
                const pointsEarned = 10 + gameState.consecutiveCorrect * 2;
                gameState.score += pointsEarned;
                gameState.consecutiveCorrect++;

                resultScreen.innerHTML = `✅ ¡Correcto! +${pointsEarned} puntos`;
                resultScreen.classList.add('correct');

                // Actualizar puntuación y progreso de nivel
                document.getElementById('scoreDisplay').textContent = gameState.score;
                
                const currentLevelConfig = LEVELS[gameState.currentLevel];
                const progressPercentage = 
                    (gameState.score / currentLevelConfig.pointsToNextLevel) * 100;
                progressFill.style.width = `${Math.min(progressPercentage, 100)}%`;

                // Subir de nivel
                if (gameState.score >= currentLevelConfig.pointsToNextLevel) {
                    gameState.currentLevel = Math.min(
                        gameState.currentLevel + 1, 
                        LEVELS.length - 1
                    );
                    resultScreen.innerHTML += ` 🎉 ¡Nivel ${gameState.currentLevel + 1}! 🎉`;
                    document.getElementById('currentLevel').textContent = gameState.currentLevel + 1;
                }

                // Generar siguiente desafío
                setTimeout(generateChallenge, 1500);
            } else {
                // Respuesta incorrecta
                resultScreen.innerHTML = 
                    `❌ Incorrecto. El número era ${gameState.currentChallenge.number}.`;
                resultScreen.classList.add('incorrect');
                
                // Reiniciar racha
                gameState.consecutiveCorrect = 0;

                // Reiniciar desafío
                setTimeout(generateChallenge, 1500);
            }
        }

        // Iniciar juego
        generateChallenge();
    </script>
</body>
</html>
